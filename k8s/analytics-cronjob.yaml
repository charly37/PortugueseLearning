apiVersion: batch/v1
kind: CronJob
metadata:
  name: portuguese-learning-analytics
  namespace: portuguese-learning
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: portuguese-learning-analytics
        spec:
          restartPolicy: OnFailure
          containers:
            - name: analytics
              image: charly37/portuguese-learning-analytics:IMAGE_TAG_PLACEHOLDER
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: mongodb-uri
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
