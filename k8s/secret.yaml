# Secret template - DO NOT store real values here.
# On the k3s VM, create the secret with real values:
#
#   kubectl create secret generic portuguese-learning-secrets \
#     --namespace=portuguese-learning \
#     --from-literal=mongodb-uri='mongodb+srv://...' \
#     --from-literal=session-secret='your-secret-key'
#
# Or apply this file after base64-encoding the values:
#   echo -n 'your-value' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: portuguese-learning-secrets
  namespace: portuguese-learning
type: Opaque
data:
  # Replace with: echo -n 'your-mongodb-uri' | base64
  mongodb-uri: REPLACE_WITH_BASE64_ENCODED_MONGODB_URI
  # Replace with: echo -n 'your-session-secret' | base64
  session-secret: REPLACE_WITH_BASE64_ENCODED_SESSION_SECRET
