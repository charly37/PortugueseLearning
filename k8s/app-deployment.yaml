apiVersion: apps/v1
kind: Deployment
metadata:
  name: portuguese-learning-app
  namespace: portuguese-learning
  labels:
    app: portuguese-learning-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portuguese-learning-app
  template:
    metadata:
      labels:
        app: portuguese-learning-app
    spec:
      containers:
        - name: app
          image: charly37/portuguese-learning:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: portuguese-learning-secrets
                  key: mongodb-uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: portuguese-learning-secrets
                  key: session-secret
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /home/ubuntu/PortugueseLearning/data
            type: Directory
