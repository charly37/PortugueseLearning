# Let's Encrypt ClusterIssuer for cert-manager.
#
# Two issuers are defined:
#   - letsencrypt-staging: use this first to test without hitting rate limits
#   - letsencrypt-prod:    use this for the real certificate once staging works
#
# Apply after cert-manager is installed and ready:
#   sudo kubectl apply -f cert-manager-issuer.yaml
#
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@dialecthub.net
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@dialecthub.net
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
