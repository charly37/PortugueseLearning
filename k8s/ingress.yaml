# Traefik Ingress - routes traffic to the app service with TLS via cert-manager.
# Traefik is bundled with k3s and enabled by default.
# cert-manager must be installed before applying this manifest.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portuguese-learning-ingress
  namespace: portuguese-learning
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - dialecthub.net
      secretName: dialecthub-tls
  rules:
    - host: dialecthub.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portuguese-learning-app
                port:
                  number: 80
