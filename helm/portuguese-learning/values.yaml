# Default values for portuguese-learning.
# Override with values-prod.yaml for production deployments.

# Namespace where all resources are deployed.
# Use a different value per Helm release to run prod and staging side-by-side.
namespace: portuguese-learning

image:
  app:
    repository: charly37/portuguese-learning
    tag: latest
    pullPolicy: IfNotPresent
  analytics:
    repository: charly37/portuguese-learning-analytics
    tag: latest
    pullPolicy: IfNotPresent
  # mongo image ships mongodump; no custom image needed for backup
  backup:
    repository: mongo
    tag: "8.0"
    pullPolicy: IfNotPresent

replicaCount: 1

app:
  nodeEnv: production
  port: 3000
  # pino log level: fatal | error | warn | info | debug | trace | silent
  logLevel: info

# Path on the host node where sounds data files live.
# Must exist on the k3s node before deploying.
weeklyAudio:
  hostPath: /home/ubuntu/PortugueseLearning/weekly-audio

sounds:
  hostPath: /home/ubuntu/PortugueseLearning/sounds

# Podcast RSS feed (hostPath is read by the app at /app/podcast and written by
# the podcast-feed CronJob at /podcast). Create the directory on the node with
# owner 1000:1000 BEFORE deploying - both manifests use hostPath type: Directory.
podcast:
  hostPath: /home/ubuntu/PortugueseLearning/podcast
  # Lessons with weekStart before this date are never published. Bump it only
  # if you intend to publish older episodes (they keep their guid either way).
  firstWeek: "2026-10-26"
  # Empty → https://<ingress.host>. Set audioBaseUrl to move MP3 delivery to a
  # CDN later without changing the code.
  baseUrl: ""
  audioBaseUrl: ""
  # Cover art must be a square 1400x1400-3000x3000 JPEG/PNG under 512 KB.
  coverFile: cover.jpg
  episodeType: episodic

backup:
  schedule: "0 1 * * 4"
  hostPath: /home/ubuntu/PortugueseLearning/backup
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

ingress:
  host: dialecthub.net
  # Use letsencrypt-staging for first-time testing to avoid rate limits
  clusterIssuer: letsencrypt-prod
  tlsSecretName: dialecthub-tls
  # Redirect www.host → host with a 301
  redirectWww: true

certManager:
  email: admin@dialecthub.net
  # Set to false for secondary releases (e.g. staging) to skip creating
  # ClusterIssuers that were already created by the primary (prod) release.
  createIssuers: true

resources:
  app:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  analytics:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  usefulness:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  weeklyChallenge:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  weeklyStory:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  vocabularyUpdaterAgent:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  vocabularyCreatorAgent:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  youtubeUploader:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  podcastFeed:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  weeklyChallengeSounds:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  backup:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

analytics:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

usefulness:
  schedule: "30 2 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 3 AM — after the daily usefulness job (2 AM) so
# weakness data is fresh when challenges are generated.
weeklyChallenge:
  schedule: "0 3 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 4 AM — after the weekly challenge job (3 AM) so
# data is fresh when challenges sounds are generated.
weeklyChallengeSounds:
  schedule: "0 4 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 5 AM — after the weekly challenge sounds job (4 AM) so
# data is fresh when the latest story is distributed to users.
weeklyStory:
  schedule: "0 5 * * 1"
  apiUrl: "https://bilingualstory.net"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

vocabularyUpdaterAgent:
  schedule: "0 6 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Friday at 7 AM 
vocabularyCreatorAgent:
  schedule: "0 7 * * 5"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 6:30 AM — after sound generation (4 AM) and story (5 AM)
youtubeUploader:
  schedule: "30 6 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 7 AM — after sound generation (4 AM) so the new MP3
# exists, and after the YouTube upload so the feed is the last step.
podcastFeed:
  schedule: "0 7 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3