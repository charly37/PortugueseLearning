# Default values for portuguese-learning.
# Override with values-prod.yaml for production deployments.

# Namespace where all resources are deployed.
# Use a different value per Helm release to run prod and staging side-by-side.
namespace: portuguese-learning

image:
  app:
    repository: charly37/portuguese-learning
    tag: latest
    pullPolicy: IfNotPresent
  analytics:
    repository: charly37/portuguese-learning-analytics
    tag: latest
    pullPolicy: IfNotPresent
  # mongo image ships mongodump; no custom image needed for backup
  backup:
    repository: mongo
    tag: "8.0"
    pullPolicy: IfNotPresent

replicaCount: 1

app:
  nodeEnv: production
  port: 3000
  # pino log level: fatal | error | warn | info | debug | trace | silent
  logLevel: info

# Path on the host node where sounds data files live.
# Must exist on the k3s node before deploying.
weeklyAudio:
  hostPath: /home/ubuntu/PortugueseLearning/weekly-audio

sounds:
  hostPath: /home/ubuntu/PortugueseLearning/sounds

# Podcast RSS feeds (hostPath is read by the app at /app/podcast and written by the
# podcast-feed CronJob at /podcast). Create the directory on the node with owner
# 1000:1000 BEFORE deploying - both manifests use hostPath type: Directory.
#
# One feed is generated per entry in `pairs`, written to
# <hostPath>/<show>/<pair>/feed.xml and served at /podcast/<show>/<pair>/feed.xml.
# Each pair also needs its own artwork at src/images/podcast/<pair>/cover.jpg.
podcast:
  hostPath: /home/ubuntu/PortugueseLearning/podcast
  # Show slug (URL segment and directory): /podcast/vocabulary/fr-pt/feed.xml
  show: vocabulary
  # Language pairs {native}-{learning}. Each pair gets its own CronJob, its own
  # feed URL (/podcast/<show>/<pair>/feed.xml) and its own cover art. The feed
  # publishes the language-matched weekly template, so only add a pair once that
  # language's lesson is being generated (weeklyChallenge.templateLanguages).
  pairs:
    - fr-pt
    - en-pt
  # Lessons with weekStart before this date are never published. Bump it only
  # if you intend to publish older episodes (they keep their guid either way).
  firstWeek: "2026-10-26"
  # Empty → https://<ingress.host>. Set audioBaseUrl to move MP3 delivery to a
  # CDN later without changing the code.
  baseUrl: ""
  audioBaseUrl: ""
  episodeType: episodic

backup:
  schedule: "0 1 * * 4"
  hostPath: /home/ubuntu/PortugueseLearning/backup
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

ingress:
  host: dialecthub.net
  # Use letsencrypt-staging for first-time testing to avoid rate limits
  clusterIssuer: letsencrypt-prod
  tlsSecretName: dialecthub-tls
  # Redirect www.host → host with a 301
  redirectWww: true

certManager:
  email: admin@dialecthub.net
  # Set to false for secondary releases (e.g. staging) to skip creating
  # ClusterIssuers that were already created by the primary (prod) release.
  createIssuers: true

resources:
  app:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  analytics:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  usefulness:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  weeklyChallenge:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  weeklyStory:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  vocabularyUpdaterAgent:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  vocabularyCreatorAgent:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  vocabularyAudioAgent:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  podcastFeed:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  weeklyChallengeSounds:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  backup:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

analytics:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

usefulness:
  schedule: "30 2 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 3 AM — after the daily usefulness job (2 AM) so
# weakness data is fresh when challenges are generated.
weeklyChallenge:
  schedule: "0 3 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 4 AM — after the weekly challenge job (3 AM) so
# data is fresh when challenges sounds are generated.
weeklyChallengeSounds:
  schedule: "0 4 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 5 AM — after the weekly challenge sounds job (4 AM).
# Generates one story per learner pair (--languages) and links every user to the
# template matching their preferredLanguage.
weeklyStory:
  schedule: "0 5 * * 1"
  apiUrl: "https://bilingualstory.net"
  languages:
    - fr
    - en
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# One CronJob per language. The schedule matters: the updater reloads every challenge
# and rewrites whole documents with $set, so two runs must never overlap.
# Phase 1 (Portuguese word validation) is language-independent — keep skipValidator
# false only on the first run of the week so the same words are not reviewed twice.
vocabularyUpdaterAgent:
  languages:
    fr:
      schedule: "0 6 * * 1"
      skipValidator: false
    en:
      schedule: "0 8 * * 1"
      skipValidator: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Friday at 7 AM 
vocabularyCreatorAgent:
  schedule: "0 7 * * 5"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Generates ElevenLabs MP3s for words/examples missing audio (or older than
# `months`) into the sounds hostPath, then records the filenames on `challenges`.
# Runs Monday at 9 AM — after the vocabulary agents (6 AM / 8 AM) so it picks up
# newly created words, and so it never overlaps the updater's whole-document $set.
# Requires the `text-to-speech-api-key` key in portuguese-learning-secrets.
vocabularyAudioAgent:
  # Disable on secondary releases (staging) that share the prod sounds hostPath:
  # both releases would generate the same files and double ElevenLabs spend.
  enabled: true
  schedule: "0 9 * * 1"
  # Regenerate audio older than this (months). 12 keeps existing MP3s for a year.
  months: 12
  # Hard cap on TTS calls per run, main words + examples combined (cost control).
  # At 50/week a full pass over the whole vocabulary takes years — raise this for
  # a one-off backfill, then put it back to 50.
  maxConversions: 50
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Runs every Monday at 7 AM — after sound generation (4 AM) and story (5 AM) so the
# new MP3 exists before the feed is regenerated.
podcastFeed:
  schedule: "0 7 * * 1"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3