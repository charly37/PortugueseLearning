apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
        {{- include "portuguese-learning.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.app.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: portuguese-learning-secrets
                  key: mongodb-uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: portuguese-learning-secrets
                  key: session-secret
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
            - name: weekly-audio
              mountPath: /app/weekly-audio
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.data.hostPath }}
            type: Directory
        - name: weekly-audio
          hostPath:
            path: {{ .Values.weeklyAudio.hostPath }}
            type: Directory