apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-weekly-story
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.weeklyStory.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.weeklyStory.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.weeklyStory.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: portuguese-learning-weekly-story
        spec:
          restartPolicy: OnFailure
          containers:
            - name: weekly-story
              image: "{{ .Values.image.analytics.repository }}:{{ .Values.image.analytics.tag }}"
              imagePullPolicy: {{ .Values.image.analytics.pullPolicy }}
              command:
                - python
                - StoryCreatorGetter.py
                - --generate
                - --all-users
                - --languages
                {{- range .Values.weeklyStory.languages }}
                - {{ . | quote }}
                {{- end }}
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: mongodb-uri
                - name: STORYCREATOR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: storycreator-api-key
                - name: STORYCREATOR_API_URL
                  value: {{ .Values.weeklyStory.apiUrl | quote }}
                - name: OPEN_AI_KEY
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: open-ai-key-weekly-story
                # Stable per Job, so a pod retry replays the same story instead of
                # generating (and paying for) a second one.
                - name: STORYCREATOR_IDEMPOTENCY_KEY
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name']
              resources:
                {{- toYaml .Values.resources.weeklyStory | nindent 16 }}
