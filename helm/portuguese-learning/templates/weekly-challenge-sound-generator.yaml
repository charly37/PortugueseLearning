apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-wchal-sounds
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.weeklyChallengeSounds.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.weeklyChallengeSounds.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.weeklyChallenge.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400 # keep pod logs/state 24h after finish for debugging
      activeDeadlineSeconds: 3600 # kill job if still running after 1h
      template:
        metadata:
          labels:
            app: portuguese-learning-wchal-sounds
        spec:
          restartPolicy: OnFailure
          containers:
            - name: wchal-sounds
              image: "{{ .Values.image.analytics.repository }}:{{ .Values.image.analytics.tag }}"
              imagePullPolicy: {{ .Values.image.analytics.pullPolicy }}
              command: ["python", "-u", "combine_mp3.py", "--weekly-challenge", "--lang", "fr", "--output-dir", "/weekly-audio"]
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: mongodb-uri
              resources:
                {{- toYaml .Values.resources.weeklyChallengeSounds | nindent 16 }}
              volumeMounts:
                - name: weekly-audio
                  mountPath: /weekly-audio
                - name: sounds
                  mountPath: /sounds
                  readOnly: true
          volumes:
            - name: weekly-audio
              hostPath:
                path: {{ .Values.weeklyAudio.hostPath }}
                type: DirectoryOrCreate
            - name: sounds
              hostPath:
                path: {{ .Values.sounds.hostPath }}
                type: DirectoryOrCreate
