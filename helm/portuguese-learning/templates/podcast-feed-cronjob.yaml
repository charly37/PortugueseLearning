{{- $root := . -}}
{{- range $pair := .Values.podcast.pairs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $root.Release.Name }}-podcast-feed-{{ $pair }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" $root | nindent 4 }}
spec:
  schedule: {{ $root.Values.podcastFeed.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $root.Values.podcastFeed.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.podcastFeed.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400 # keep pod logs/state 24h after finish for debugging
      activeDeadlineSeconds: 900 # feed generation is a light Mongo read + HTTP-less XML write
      template:
        metadata:
          labels:
            app: portuguese-learning-podcast-feed
        spec:
          restartPolicy: OnFailure
          containers:
            - name: podcast-feed
              image: "{{ $root.Values.image.analytics.repository }}:{{ $root.Values.image.analytics.tag }}"
              imagePullPolicy: {{ $root.Values.image.analytics.pullPolicy }}
              command:
                - python
                - -u
                - generate_podcast_feed.py
                - --audio-dir
                - /weekly-audio
                - --output-root
                - /podcast
                - --show
                - {{ $root.Values.podcast.show | quote }}
                - --pair
                - {{ $pair | quote }}
                - --first-week
                - {{ $root.Values.podcast.firstWeek | quote }}
                - --base-url
                - {{ $root.Values.podcast.baseUrl | default (printf "https://%s" $root.Values.ingress.host) | quote }}
                - --audio-base-url
                - {{ $root.Values.podcast.audioBaseUrl | default (printf "https://%s" $root.Values.ingress.host) | quote }}
                - --episode-type
                - {{ $root.Values.podcast.episodeType | default "episodic" | quote }}
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: mongodb-uri
              resources:
                {{- toYaml $root.Values.resources.podcastFeed | nindent 16 }}
              volumeMounts:
                - name: weekly-audio
                  mountPath: /weekly-audio
                  readOnly: true
                - name: podcast
                  mountPath: /podcast
          volumes:
            - name: weekly-audio
              hostPath:
                path: {{ $root.Values.weeklyAudio.hostPath }}
                type: Directory
            - name: podcast
              hostPath:
                path: {{ $root.Values.podcast.hostPath }}
                type: Directory
{{- end }}
