{{- /*
  Block public access to /metrics via a Traefik ipAllowList Middleware.

  External requests to dialecthub.net/metrics will receive 403 Forbidden.
  Internal cluster traffic (e.g. Prometheus pods) bypasses the ingress entirely
  by scraping the Service ClusterIP directly, so they are unaffected.

  Traefik version note:
    - Traefik v3 (k3s >= 1.30):  uses `ipAllowList` (this file)
    - Traefik v2 (k3s <  1.30):  rename the spec key to `ipWhiteList`
                                  e.g.  spec:\n    ipWhiteList:\n      sourceRange: [...]
*/ -}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: block-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - "127.0.0.1/32"     # loopback
      - "10.0.0.0/8"       # RFC-1918 class A  (k8s pod CIDRs)
      - "172.16.0.0/12"    # RFC-1918 class B  (Docker / k3s default)
      - "192.168.0.0/16"   # RFC-1918 class C
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-metrics-block
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Reference the Middleware defined above (format: <namespace>-<name>@kubernetescrd)
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.namespace }}-block-metrics@kubernetescrd
    # Higher priority than the catch-all "/" ingress so this rule is evaluated first
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-app
                port:
                  number: 80
