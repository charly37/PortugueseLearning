{{- $root := . -}}
{{- range $lang, $cfg := .Values.vocabularyUpdaterAgent.languages }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $root.Release.Name }}-vocabulary-updater-agent-{{ $lang }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "portuguese-learning.labels" $root | nindent 4 }}
spec:
  schedule: {{ $cfg.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $root.Values.vocabularyUpdaterAgent.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.vocabularyUpdaterAgent.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: portuguese-learning-vocabulary-updater-agent
        spec:
          restartPolicy: OnFailure
          containers:
            - name: vocabulary-updater-agent
              image: "{{ $root.Values.image.analytics.repository }}:{{ $root.Values.image.analytics.tag }}"
              imagePullPolicy: {{ $root.Values.image.analytics.pullPolicy }}
              command:
                - python
                - VocabularyUpdaterAgent.py
                - --language
                - {{ $lang | quote }}
                - --max-words
                - "50"
                - --validator-model
                - gpt-4.1
                - --model
                - gpt-4.1-mini
                {{- if $cfg.skipValidator }}
                - --skip-validator
                {{- end }}
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: mongodb-uri
                - name: OPEN_AI_KEY
                  valueFrom:
                    secretKeyRef:
                      name: portuguese-learning-secrets
                      key: open-ai-key
              resources:
                {{- toYaml $root.Values.resources.vocabularyUpdaterAgent | nindent 16 }}
{{- end }}
