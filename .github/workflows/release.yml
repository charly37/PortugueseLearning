name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.5.0)'
        required: true
        type: string
      notes:
        description: 'Extra release notes to prepend (optional)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate version format
      run: |
        if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format. Expected format: v1.2.3"
          exit 1
        fi

    - name: Check tag does not already exist
      run: |
        if git ls-remote --tags origin | grep -q "refs/tags/${{ github.event.inputs.version }}$"; then
          echo "Tag ${{ github.event.inputs.version }} already exists"
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build server
      run: npm run build:server

    - name: Build client
      run: npm run build:client

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Create and push git tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
        git push origin "${{ github.event.inputs.version }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push App Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }} .
        docker tag ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }} \
          ${{ vars.DOCKER_USERNAME }}/portuguese-learning:latest
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:latest

    - name: Build and push Analytics Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }} \
          -f analytics/Dockerfile .
        docker tag ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }} \
          ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:latest
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:latest

    - name: Install Helm
      run: curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Lint Helm chart
      run: helm lint helm/portuguese-learning

    - name: Update Helm chart default image tags
      run: |
        sed -i "s/^\(\s*tag:\s*\)latest$/\1${{ github.event.inputs.version }}/" helm/portuguese-learning/values.yaml

    - name: Package Helm chart
      run: |
        CHART_VERSION="${{ github.event.inputs.version }}"
        CHART_VERSION="${CHART_VERSION#v}"
        helm package helm/portuguese-learning \
          --version "$CHART_VERSION" \
          --app-version ${{ github.event.inputs.version }} \
          --destination .
        echo "Helm chart packaged: $(ls portuguese-learning-*.tgz)"

    - name: Push Helm chart to GHCR
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        helm push portuguese-learning-*.tgz oci://ghcr.io/${{ github.repository_owner }}

    - name: Create GitHub Release
      run: |
        CHART_VERSION="${{ github.event.inputs.version }}"
        CHART_VERSION="${CHART_VERSION#v}"
        DOCKER_NOTES=$(printf '%s\n' \
          '## Docker Images' \
          '' \
          "**App:** \`docker pull ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }}\`" \
          "[View on Docker Hub](https://hub.docker.com/r/${{ vars.DOCKER_USERNAME }}/portuguese-learning/tags)" \
          '' \
          "**Analytics:** \`docker pull ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }}\`" \
          "[View on Docker Hub](https://hub.docker.com/r/${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics/tags)" \
          '' \
          '## Kubernetes Deployment' \
          '' \
          'Ensure the `portuguese-learning-secrets` secret exists before installing (one-time setup):' \
          '```bash' \
          'kubectl create secret generic portuguese-learning-secrets \' \
          '  --namespace=portuguese-learning \' \
          "  --from-literal=mongodb-uri='<your-atlas-uri>' \\" \
          "  --from-literal=session-secret='<your-secret-key>'" \
          '```' \
          '' \
          'Then install or upgrade with Helm:' \
          '```bash' \
          "helm upgrade --install portuguese-learning \\" \
          '  oci://ghcr.io/charly37/portuguese-learning \' \
          "  --version $CHART_VERSION \\" \
          '  --namespace portuguese-learning --create-namespace' \
          '```' \
          '' \
          'Or clone the repo and install from the local chart:' \
          '```bash' \
          "helm upgrade --install portuguese-learning helm/portuguese-learning \\" \
          "  --values helm/portuguese-learning/values-prod.yaml \\" \
          '  --namespace portuguese-learning --create-namespace' \
          '```')

        EXTRA="${{ github.event.inputs.notes }}"
        if [ -n "$EXTRA" ]; then
          NOTES=$(printf '%s\n\n%s' "$DOCKER_NOTES" "$EXTRA")
        else
          NOTES="$DOCKER_NOTES"
        fi

        gh release create "${{ github.event.inputs.version }}" \
          portuguese-learning-*.tgz \
          --title "Release ${{ github.event.inputs.version }}" \
          --notes "$NOTES" \
          --generate-notes \
          --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
