name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.5.0)'
        required: true
        type: string
      notes:
        description: 'Extra release notes to prepend (optional)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate version format
      run: |
        if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format. Expected format: v1.2.3"
          exit 1
        fi

    - name: Check tag does not already exist
      run: |
        if git ls-remote --tags origin | grep -q "refs/tags/${{ github.event.inputs.version }}$"; then
          echo "Tag ${{ github.event.inputs.version }} already exists"
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build server
      run: npm run build:server

    - name: Build client
      run: npm run build:client

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Create and push git tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
        git push origin "${{ github.event.inputs.version }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push App Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }} .
        docker tag ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }} \
          ${{ vars.DOCKER_USERNAME }}/portuguese-learning:latest
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:latest

    - name: Build and push Analytics Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }} \
          -f analytics/Dockerfile .
        docker tag ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }} \
          ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:latest
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:latest

    - name: Render K8s manifests
      run: |
        mkdir -p rendered-k8s
        for f in k8s/*.yaml; do
          sed "s/IMAGE_TAG_PLACEHOLDER/${{ github.event.inputs.version }}/g" "$f" > "rendered-k8s/$(basename $f)"
        done
        zip -j k8s-manifests-${{ github.event.inputs.version }}.zip rendered-k8s/*.yaml
        echo "Manifests rendered with image tag: ${{ github.event.inputs.version }}"
        grep -h "image:" rendered-k8s/*.yaml || true

    - name: Create GitHub Release
      run: |
        DOCKER_NOTES=$(printf '%s\n' \
          '## Docker Images' \
          '' \
          "**App:** \`docker pull ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }}\`" \
          "[View on Docker Hub](https://hub.docker.com/r/${{ vars.DOCKER_USERNAME }}/portuguese-learning/tags)" \
          '' \
          "**Analytics:** \`docker pull ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }}\`" \
          "[View on Docker Hub](https://hub.docker.com/r/${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics/tags)" \
          '' \
          '## Kubernetes Deployment' \
          '' \
          "Download \`k8s-manifests-${{ github.event.inputs.version }}.zip\` from the release assets, then:" \
          '```bash' \
          "unzip k8s-manifests-${{ github.event.inputs.version }}.zip -d rendered-k8s" \
          'kubectl apply -f rendered-k8s/' \
          '```')

        EXTRA="${{ github.event.inputs.notes }}"
        if [ -n "$EXTRA" ]; then
          NOTES=$(printf '%s\n\n%s' "$DOCKER_NOTES" "$EXTRA")
        else
          NOTES="$DOCKER_NOTES"
        fi

        gh release create "${{ github.event.inputs.version }}" \
          k8s-manifests-${{ github.event.inputs.version }}.zip \
          --title "Release ${{ github.event.inputs.version }}" \
          --notes "$NOTES" \
          --generate-notes \
          --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
