name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.5.0)'
        required: true
        type: string
      notes:
        description: 'Extra release notes to prepend (optional)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate version format
      run: |
        if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format. Expected format: v1.2.3"
          exit 1
        fi

    - name: Check tag does not already exist
      run: |
        if git ls-remote --tags origin | grep -q "refs/tags/${{ github.event.inputs.version }}$"; then
          echo "Tag ${{ github.event.inputs.version }} already exists"
          exit 1
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build server
      run: npm run build:server

    - name: Build client
      run: npm run build:client

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run tests
      run: npm test
      env:
        CI: true

    - name: Create and push git tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
        git push origin "${{ github.event.inputs.version }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push App Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }} .
        docker tag ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }} \
          ${{ vars.DOCKER_USERNAME }}/portuguese-learning:latest
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ github.event.inputs.version }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:latest

    - name: Build and push Analytics Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }} \
          -f analytics/Dockerfile .
        docker tag ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }} \
          ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:latest
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ github.event.inputs.version }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:latest

    - name: Create GitHub Release
      run: |
        EXTRA="${{ github.event.inputs.notes }}"
        if [ -n "$EXTRA" ]; then
          gh release create "${{ github.event.inputs.version }}" \
            --title "Release ${{ github.event.inputs.version }}" \
            --notes "$EXTRA" \
            --generate-notes \
            --latest
        else
          gh release create "${{ github.event.inputs.version }}" \
            --title "Release ${{ github.event.inputs.version }}" \
            --generate-notes \
            --latest
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
