name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build server
      run: npm run build:server

    - name: Build client
      run: npm run build:client

    - name: Check for errors
      run: |
        if [ ! -d "dist" ] || [ ! -d "public" ]; then
          echo "Build failed - missing dist or public directory"
          exit 1
        fi

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright Tests
      run: npm test
      env:
        CI: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get short commit SHA
      id: vars
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set image tags
      id: tags
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
          echo "app_tag=dev-${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT
          echo "floating_tag=dev" >> $GITHUB_OUTPUT
        else
          echo "app_tag=${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT
          echo "floating_tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Build App Docker image
      run: docker build -t portuguese-learning:${{ steps.tags.outputs.app_tag }} .

    - name: Build Analytics Docker image
      run: docker build -t portuguese-learning-analytics:${{ steps.tags.outputs.app_tag }} -f analytics/Dockerfile .

    - name: Test Docker image with MongoDB
      run: |
        # Create isolated network for container communication
        docker network create test-network

        # Start MongoDB container
        docker run -d --name test-mongo --network test-network mongo:latest
        sleep 5

        # Start app container connected via container hostname
        docker run -d -p 3000:3000 --name test-app --network test-network \
          -e MONGODB_URI=mongodb://test-mongo:27017/portuguese-test \
          -e SESSION_SECRET=test-secret-key \
          -v ${{ github.workspace }}/data:/app/data:ro \
          portuguese-learning:${{ steps.tags.outputs.app_tag }}

        # Wait for app to start
        sleep 10

        # Test health endpoint
        curl -f http://localhost:3000/api/health || exit 1

        # Cleanup
        docker stop test-app test-mongo
        docker rm test-app test-mongo
        docker network rm test-network

    - name: Push to Docker Hub
      run: |
        # Tag and push with commit-specific tag
        docker tag portuguese-learning:${{ steps.tags.outputs.app_tag }} ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ steps.tags.outputs.app_tag }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ steps.tags.outputs.app_tag }}

        docker tag portuguese-learning-analytics:${{ steps.tags.outputs.app_tag }} ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ steps.tags.outputs.app_tag }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ steps.tags.outputs.app_tag }}

        # Also tag and push floating tag (latest or dev)
        docker tag portuguese-learning:${{ steps.tags.outputs.app_tag }} ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ steps.tags.outputs.floating_tag }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ steps.tags.outputs.floating_tag }}

        docker tag portuguese-learning-analytics:${{ steps.tags.outputs.app_tag }} ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ steps.tags.outputs.floating_tag }}
        docker push ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ steps.tags.outputs.floating_tag }}

    - name: Create deployment info
      run: |
        echo "Deployment Info" > deployment-info.txt
        echo "===============" >> deployment-info.txt
        echo "Commit SHA: ${{ github.sha }}" >> deployment-info.txt
        echo "Short SHA: ${{ steps.vars.outputs.short_sha }}" >> deployment-info.txt
        echo "Branch: ${{ github.ref_name }}" >> deployment-info.txt
        echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> deployment-info.txt
        echo "" >> deployment-info.txt
        echo "Docker Images:" >> deployment-info.txt
        echo "  - ${{ vars.DOCKER_USERNAME }}/portuguese-learning:${{ steps.tags.outputs.app_tag }}" >> deployment-info.txt
        echo "  - ${{ vars.DOCKER_USERNAME }}/portuguese-learning-analytics:${{ steps.tags.outputs.app_tag }}" >> deployment-info.txt
        cat deployment-info.txt

    - name: Upload deployment info
      uses: actions/upload-artifact@v6
      with:
        name: deployment-info-${{ steps.vars.outputs.short_sha }}
        path: deployment-info.txt
        retention-days: 90
